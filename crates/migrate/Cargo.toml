[package]
name    = "migrate"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio  = { version = "1", features = ["full"] }
anyhow = "1"

[dependencies.sqlx]
version          = "0.8"          # ← must match root Cargo.toml exactly
default-features = false          # ← disables sqlite, mysql, etc.
features         = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
]