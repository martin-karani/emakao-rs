  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:3000"
  #   env_file: .env
  #   environment:
  #     PLATFORM_DATABASE_URL: postgres://emakao:password@postgres:5432/emakao_platform
  #     AGENCY_DATABASE_URL:   postgres://emakao:password@postgres:5432/emakao_agency
  #     REDIS_URL:             redis://redis:6379
  #     AWS_ENDPOINT_URL:      http://minio:9000
  #     OPENFGA_URL:           http://openfga:8080
  #     SMTP_HOST:             mailhog
