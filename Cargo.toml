[workspace]
members  = [".", "crates/migrate"]
resolver = "2"

[workspace.dependencies]
tokio             = { version = "1",       features = ["full"] }
sqlx              = { version = "0.8",     features = [
                        "postgres",
                        "uuid",
                        "time",
                        "json",
                        "macros",
                        "migrate",
                        "runtime-tokio-rustls",
                        "rust_decimal",
                    ], default-features = false  }
serde             = { version = "1",       features = ["derive"] }
serde_json        = "1"
uuid              = { version = "1",       features = ["v4", "v7", "serde"] }
time              = { version = "0.3",     features = ["serde", "formatting", "parsing"] }
anyhow            = "1"
async-trait       = "0.1"
rust_decimal      = { version = "1.41",    features = ["db-postgres", "serde-with-str"] }
tracing           = "0.1"

[package]
name    = "emakao"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "emakao"
path = "src/main.rs"

[dependencies]
tokio             = { workspace = true }

axum              = { version = "0.8.9",   features = ["macros", "ws", "multipart"] }
tower             = { version = "0.5", features = ["buffer", "limit"] }
tower-http        = { version = "0.6",     features = ["cors", "trace", "compression-gzip"] }
socketioxide      = { version = "0.18.3" }

sqlx              = { workspace = true }
dashmap           = "6"

fred              = { version = "9",       features = ["default", "subscriber-client"] }
minijinja         = { version = "2",       features = ["loader", "builtins"] }

apalis            = { version = "0.7",     features = ["limit"] }
apalis-redis      = { version = "0.7" }

jsonwebtoken      = "9"
argon2            = "0.5"

reqwest           = { version = "0.13.3", features = ["json", "form", "rustls"], default-features = false }

serde             = { workspace = true }
serde_json        = { workspace = true }
serde_with        = { version = "3",       features = ["time_0_3"] }

config            = "0.14"
dotenvy           = "0.15"

thiserror         = "1"
anyhow            = { workspace = true }

garde             = { version = "0.22.1",  features = ["derive", "full"] }

tracing           = { workspace = true }
tracing-subscriber = { version = "0.3",   features = ["env-filter", "json"] }

uuid              = { workspace = true }
time              = { workspace = true }
rust_decimal      = { workspace = true }

utoipa            = { version = "5.4",     features = ["axum_extras", "uuid", "time", "decimal"] }
utoipa-swagger-ui = { version = "9.0",     features = ["axum"] }

tonic             = { version = "0.12" }

lettre            = { version = "0.11",    features = ["smtp-transport", "tokio1", "builder"], default-features = false }

futures           = "0.3"

aws-sdk-s3        = "1"
aws-config        = "1"

base64            = "0.22"
hmac              = "0.12"
sha2              = "0.10"
hex               = "0.4"

async-trait       = { workspace = true }
rand              = "0.9.4"


# AES-256-GCM encryption for agency_integrations.credentials
aes-gcm           = "0.10"

# JSONLogic condition evaluation for workflow_rules
jsonlogic         = "0.4"
redis = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
